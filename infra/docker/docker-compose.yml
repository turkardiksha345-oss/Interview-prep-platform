services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: interviewprep
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d interviewprep"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ../../backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/interviewprep
      JWT_SECRET: local-dev-secret
      CORS_ORIGINS: '["http://localhost:5173","http://localhost"]'
      EVALUATOR_URL: http://code-evaluator:9000
    depends_on:
      postgres:
        condition: service_healthy
      code-evaluator:
        condition: service_started
    ports:
      - "8000:8000"

  code-evaluator:
    build: ../../services/code-evaluator
    ports:
      - "9000:9000"

  frontend:
    build: ../../frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
