services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: interviewprep
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-db-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d interviewprep"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ../../backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-change-this-db-password}@postgres:5432/interviewprep
      JWT_SECRET: ${JWT_SECRET:-change-this-jwt-secret}
      EVALUATOR_URL: http://code-evaluator:9000
      ENVIRONMENT: ec2
    depends_on:
      postgres:
        condition: service_healthy
      code-evaluator:
        condition: service_started
    expose:
      - "8000"

  code-evaluator:
    build: ../../services/code-evaluator
    restart: unless-stopped
    expose:
      - "9000"

  frontend:
    build: ../../frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
