apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: interview-prep-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/interview-prep-platform.git
    targetRevision: main
    path: infra/k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: interview-prep
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
